media:
  input: assets/photos
  output: /assets/photos

content:
  - name: homepage
    label: Homepage
    type: file
    path: homepage.json
    fields:
      - name: heading
        label: Main Heading
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Description
        type: text
        
  - name: gallery
    label: Photo Gallery
    type: file
    path: gallery.json
    fields:
      - name: title
        label: Gallery Title
        type: string
      - name: photos
        label: Gallery Photos
        type: image
        options:
          multiple: true
